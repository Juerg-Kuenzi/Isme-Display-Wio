name: Firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kernlogik auf dem PC testen
        run: make -C tests/host

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Boardpaket und Bibliotheken installieren
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
          arduino-cli core update-index
          arduino-cli core install Seeeduino:samd
          arduino-cli lib update-index
          arduino-cli lib install "Seeed Arduino rpcWiFi" "FlashStorage_SAMD"
          arduino-cli core list
          arduino-cli lib list

      # In der CI gibt es keine echten Zugangsdaten, die Vorlage genuegt zum Kompilieren.
      - name: secrets.h aus der Vorlage
        run: cp firmware/IsmeDisplay/secrets.h.example firmware/IsmeDisplay/secrets.h

      - name: Kompilieren
        run: >
          arduino-cli compile --fqbn Seeeduino:samd:seeed_wio_terminal --warnings default
          --output-dir build firmware/IsmeDisplay

      # UF2 zum Aufspielen per Drag-and-drop. Der Bootloader des Wio Terminal belegt die ersten 16 KB.
      - name: UF2-Datei erzeugen
        env:
          # Fester Stand von microsoft/uf2. Der Stand auf master hatte am 9.11.2026 ein ungueltiges uf2families.json.
          UF2_COMMIT: cf3bd7f9c274b949528f8cd6a19eef2502a687d2
        run: |
          curl -fsSLo uf2conv.py https://raw.githubusercontent.com/microsoft/uf2/${UF2_COMMIT}/utils/uf2conv.py
          curl -fsSLo uf2families.json https://raw.githubusercontent.com/microsoft/uf2/${UF2_COMMIT}/utils/uf2families.json
          python3 uf2conv.py -c -b 0x4000 -f SAMD51 -o build/IsmeDisplay.uf2 build/IsmeDisplay.ino.bin
          ls -l build

      - uses: actions/upload-artifact@v4
        with:
          name: IsmeDisplay-firmware
          path: |
            build/IsmeDisplay.uf2
            build/IsmeDisplay.ino.bin
          if-no-files-found: error
