name: Firmware

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kernlogik auf dem PC testen
        run: make -C tests/host

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # nur für das Anhängen an ein Release nötig
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Boardpaket und Bibliotheken installieren
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
          arduino-cli core update-index
          arduino-cli core install Seeeduino:samd
          arduino-cli lib update-index
          arduino-cli lib install "Seeed Arduino rpcWiFi" "FlashStorage_SAMD" "PubSubClient"
          arduino-cli core list
          arduino-cli lib list

      # Ohne secrets.h: Die Zugangsdaten werden ueber die USB-Konsole gesetzt
      # und im Flash gespeichert, die Datei ist deshalb an Bord verwendbar.
      - name: Kompilieren
        run: >
          arduino-cli compile --fqbn Seeeduino:samd:seeed_wio_terminal --warnings default
          --output-dir build firmware/IsmeDisplay

      # Die Einstellungen liegen im letzten Flash-Block ab 0x7E000 (app.cpp).
      # Das Programm beginnt nach dem Bootloader bei 0x4000 und darf ihn nie erreichen.
      - name: Platz fuer die Einstellungen pruefen
        run: |
          SIZE=$(stat -c %s build/IsmeDisplay.ino.bin)
          LIMIT=$((0x7E000 - 0x4000))
          echo "Programm ${SIZE} Bytes, erlaubt ${LIMIT} Bytes"
          test "${SIZE}" -lt "${LIMIT}"

      # UF2 zum Aufspielen per Drag-and-drop. Der Bootloader des Wio Terminal belegt die ersten 16 KB.
      - name: UF2-Datei erzeugen
        env:
          # Fester Stand von microsoft/uf2. Der Stand auf master hatte am 9.11.2026 ein ungueltiges uf2families.json.
          UF2_COMMIT: cf3bd7f9c274b949528f8cd6a19eef2502a687d2
        run: |
          curl -fsSLo uf2conv.py https://raw.githubusercontent.com/microsoft/uf2/${UF2_COMMIT}/utils/uf2conv.py
          curl -fsSLo uf2families.json https://raw.githubusercontent.com/microsoft/uf2/${UF2_COMMIT}/utils/uf2families.json
          python3 uf2conv.py -c -b 0x4000 -f SAMD51 -o build/IsmeDisplay.uf2 build/IsmeDisplay.ino.bin
          VERSION=$(sed -n 's/^#define FW_VERSION *"\(.*\)".*/\1/p' firmware/IsmeDisplay/config.h)
          mkdir -p dist
          cp build/IsmeDisplay.uf2 "dist/IsmeDisplay-${VERSION}.uf2"
          ls -l build dist

      - uses: actions/upload-artifact@v4
        with:
          name: IsmeDisplay-firmware
          path: |
            dist/*.uf2
            build/IsmeDisplay.ino.bin
          if-no-files-found: error

      - name: An das Release anhängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.uf2 --clobber
